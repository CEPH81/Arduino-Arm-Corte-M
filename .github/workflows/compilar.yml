# Compila todos los ejemplos en todas las placas en cada push y pull request.
name: Compilar placas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        placa:
          - f407ve_black
          - nucleo_l432kc
          - weact_g431
          - weact_wb55
          - generic_h503
          - gd32f427v_start
          - weact_at32f403a
          - atstart_f437
          - hc32f460jeta
          - swm181cb
          - swm34svet6
    steps:
      - uses: actions/checkout@v4

      - name: Compilador xPack arm-none-eabi-gcc 14.2.1
        run: |
          curl -sSL -o gcc.tgz https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz
          echo "ed8c7d207a85d00da22b90cf80ab3b0b2c7600509afadf6b7149644e9d4790a6  gcc.tgz" | sha256sum -c
          mkdir -p $HOME/xpack && tar xzf gcc.tgz -C $HOME/xpack

      - uses: arduino/setup-arduino-cli@v2

      - name: Instalar el núcleo desde el repositorio
        run: |
          mkdir -p $HOME/Arduino/hardware/CEPH81
          ln -s $GITHUB_WORKSPACE/cortexm $HOME/Arduino/hardware/CEPH81/cortexm
          echo "compiler.path=$HOME/xpack/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin/" > cortexm/platform.local.txt
          arduino-cli core update-index

      - name: Compilar ejemplos
        run: |
          for ej in cortexm/libraries/CortexM/examples/*/; do
            echo "::group::${{ matrix.placa }} - $(basename $ej)"
            arduino-cli compile --fqbn CEPH81:cortexm:${{ matrix.placa }} --warnings default "$ej"
            echo "::endgroup::"
          done
