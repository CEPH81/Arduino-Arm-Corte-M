# Al empujar una etiqueta vX.Y.Z: empaqueta el núcleo, crea la Release con el
# zip y actualiza package_ceph81_cortexm_index.json en main.
name: Publicar versión

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Empaquetar
        id: pkg
        run: |
          VER="${GITHUB_REF_NAME#v}"
          python3 tools/make_release.py "$VER"
          echo "ver=$VER" >> $GITHUB_OUTPUT

      - name: Crear la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Arduino Arm Cortex-M ${{ steps.pkg.outputs.ver }}
          files: dist/cortexm-${{ steps.pkg.outputs.ver }}.zip

      - name: Actualizar el índice en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package_ceph81_cortexm_index.json cortexm/platform.txt
          git commit -m "Índice del Gestor de placas: versión ${{ steps.pkg.outputs.ver }}" || echo "sin cambios"
          git push origin main
